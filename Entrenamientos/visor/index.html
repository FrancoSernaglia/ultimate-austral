<style>
/* Layout: barra de cancha arriba (marca + pestañas), contenido en una columna de 1100px; fichas en grilla con miniatura del diagrama. */
:root {
  --bg: #f2f5f0;
  --surface: #ffffff;
  --ink: #102a20;
  --muted: #56695f;
  --line: #d4ded6;
  --field: #0b3d2e;
  --field-ink: #f4f8f3;
  --accent: #ffd60a;
  --accent-ink: #0b3d2e;
  --chip: #e4ece5;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07211a; --surface: #0d3025; --ink: #e8f1eb; --muted: #9ab3a6; --line: #1f4a3b;
    --field: #0b3d2e; --field-ink: #f4f8f3; --accent: #ffd60a; --accent-ink: #0b3d2e; --chip: #143d30;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07211a; --surface: #0d3025; --ink: #e8f1eb; --muted: #9ab3a6; --line: #1f4a3b;
  --field: #0b3d2e; --field-ink: #f4f8f3; --accent: #ffd60a; --accent-ink: #0b3d2e; --chip: #143d30;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--field); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--field); color: var(--field-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.barra-in { max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: end; gap: 6px 28px; padding-block: 14px 0; }
.marca { display: grid; gap: 0; padding-bottom: 12px; }
.marca small { font: 700 13px/1 var(--display); letter-spacing: .14em; color: var(--accent); }
.marca b { font: 700 30px/1.05 var(--display); letter-spacing: .01em; text-transform: uppercase; }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
nav a { text-decoration: none; font: 600 17px/1 var(--display); letter-spacing: .06em; text-transform: uppercase;
  padding: 12px 14px 13px; border-bottom: 4px solid transparent; color: color-mix(in srgb, var(--field-ink) 75%, transparent); white-space: nowrap; }
nav a[aria-current="page"] { color: var(--field-ink); border-bottom-color: var(--accent); }

main { max-width: 1100px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; line-height: 1.1; margin: 0; }
h1 { font-size: clamp(30px, 5vw, 44px); text-transform: uppercase; letter-spacing: .01em; }
.lead { color: var(--muted); max-width: 62ch; margin: 8px 0 0; font-size: 17px; }
.cabeza { display: grid; gap: 4px; margin-bottom: 22px; }
.eyebrow { font: 700 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* habilidades */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px 7px 8px;
  font: 600 15px/1 var(--body); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.chip .n { font: 700 12px/1 var(--display); background: var(--chip); color: var(--muted); border-radius: 999px; padding: 5px 7px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--field); color: var(--field-ink); border-color: var(--field); }
.chip[aria-pressed="true"] .n { background: var(--accent); color: var(--accent-ink); }
.herram { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; color: var(--muted); font-size: 15px; }
.herram label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.herram input { accent-color: var(--field); width: 18px; height: 18px; }
.desc-hab { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 22px; max-width: 760px; }
.desc-hab h2 { font-size: 24px; text-transform: uppercase; margin-bottom: 6px; }
.desc-hab p, .desc-hab li { color: var(--ink); }

.grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.ficha { display: grid; grid-template-rows: auto 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; text-decoration: none; transition: transform .15s ease, border-color .15s ease; }
.ficha:hover { transform: translateY(-2px); border-color: var(--muted); }
.mini { position: relative; aspect-ratio: 4 / 3; background: var(--field); overflow: hidden; max-width: 100%; }
.mini img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 52%; display: block; }
.mini .vacia { position: absolute; inset: 14px; border: 2px solid color-mix(in srgb, var(--field-ink) 55%, transparent); display: grid; place-items: center;
  background: repeating-linear-gradient(0deg, transparent 0 22%, color-mix(in srgb, var(--field-ink) 5%, transparent) 22% 44%); }
.mini .vacia span { font: 700 46px/1 var(--display); color: color-mix(in srgb, var(--field-ink) 30%, transparent); }
.tag-video { position: absolute; top: 10px; left: 10px; background: var(--accent); color: var(--accent-ink); font: 700 13px/1 var(--display);
  letter-spacing: .08em; text-transform: uppercase; padding: 6px 8px; border-radius: 4px; }
.ficha-txt { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
.ficha-txt h3 { font-size: 22px; }
.ficha-txt p { margin: 0; color: var(--muted); font-size: 15px; }
.datos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.dato { font-size: 13px; background: var(--chip); color: var(--ink); border-radius: 4px; padding: 3px 7px; font-variant-numeric: tabular-nums; }
.nivel { font-weight: 600; }
.nivel-inicial { box-shadow: inset 3px 0 0 #3fae6b; }
.nivel-intermedio { box-shadow: inset 3px 0 0 #e8a33a; }
.nivel-avanzado { box-shadow: inset 3px 0 0 #d9534f; }
.vacio { color: var(--muted); padding: 28px 0; }

/* detalle */
.volver { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-weight: 600; }
.detalle { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 32px; align-items: start; }
.medio { display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 90px); }
.medio video, .medio img { width: 100%; max-width: 100%; aspect-ratio: 4 / 5; border-radius: 10px; background: var(--field); display: block; object-fit: contain; }
.medio .alt { display: flex; gap: 8px; }
.medio button { flex: 1; font: 600 15px/1 var(--body); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.medio button[aria-pressed="true"] { background: var(--field); color: var(--field-ink); border-color: var(--field); }
.sin-medio { aspect-ratio: 4 / 5; border-radius: 10px; background: var(--field); color: var(--field-ink); display: grid; place-items: center; text-align: center; padding: 24px; }
.sin-medio p { margin: 0; opacity: .8; max-width: 26ch; }
.spec { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 18px 0 8px; }
.spec div { background: var(--surface); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.spec dt { font: 700 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.spec dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.prosa { max-width: 68ch; }
.prosa h2, .prosa h3 { font-size: 22px; text-transform: uppercase; letter-spacing: .02em; margin: 26px 0 8px; }
.prosa h4 { font-size: 19px; margin: 18px 0 6px; }
.prosa ul, .prosa ol { padding-left: 1.3em; margin: 6px 0; }
.prosa li { margin: 4px 0; }
.prosa p { margin: 8px 0; }
.prosa code, .regla { font-size: .88em; background: var(--chip); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.prosa a.ref { font-weight: 600; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 3px; }
.prosa a.vid { white-space: nowrap; font-weight: 600; text-decoration: none; background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 1px 6px; font-size: 14px; }
.tabla { overflow-x: auto; margin: 10px 0 14px; border: 1px solid var(--line); border-radius: 10px; }
.tabla table { border-collapse: collapse; width: 100%; font-size: 15px; background: var(--surface); }
.tabla th { text-align: left; font: 700 13px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--chip); }
.tabla th, .tabla td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabla tr:last-child td { border-bottom: 0; }
.tabla td:first-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.prosa-ancha { max-width: none; }
.sel-semana { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; color: var(--muted); }
.sel-semana select { font: 500 15px var(--body); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }

@media (max-width: 760px) {
  .detalle { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .medio { position: static; }
  nav { margin-left: 0; width: 100%; }
  .marca { padding-bottom: 4px; }
}
@media (prefers-reduced-motion: reduce) { .ficha { transition: none; } .ficha:hover { transform: none; } }
</style>

<script>
const D = {"habilidades": [{"id": "calentamiento", "carpeta": "01-calentamiento", "num": "01", "nombre": "Calentamiento", "html": "<p>Siempre los primeros 10 a 15 minutos. Con principiantes es donde más se previenen lesiones (rodilla y tobillo por frenadas y cambios de dirección) y donde se mete técnica de carrera sin que parezca clase.<\/p>\n<p>Orden: activación (trote) → movilidad dinámica → frenadas y cambios de dirección → disco en parejas.<\/p>\n<p>Nada de estiramiento estático largo antes de jugar; eso va al final.<\/p>"}, {"id": "lanzamientos", "carpeta": "02-lanzamientos", "num": "02", "nombre": "Lanzamientos", "html": "<p>El cuello de botella de todo equipo nuevo. Cada práctica tiene al menos 20 minutos con disco en la mano (con 12 discos alcanza para uno cada dos, sobra).<\/p>\n<p>Progresión:<\/p>\n<ol>\n<li>Backhand quieto, 5 a 10 m, plano.<\/li>\n<li>Forehand quieto, 5 a 10 m.<\/li>\n<li>Pivote: pie de apoyo fijo, paso largo hacia un lado y el otro.<\/li>\n<li>Lanzar con marca (pivote + amague).<\/li>\n<li>Lanzar a un compañero que corre (poner el disco en el espacio).<\/li>\n<li>Distancia y ángulos (inside-out, outside-in), después hammer.<\/li>\n<\/ol>"}, {"id": "recepcion", "carpeta": "03-recepcion", "num": "03", "nombre": "Recepción", "html": "<p>La mitad de los turnovers de un equipo nuevo son discos que tocan las manos y se caen. Se entrena casi siempre dentro de otros ejercicios, pero vale tener 5-10 minutos dedicados cuando se vea que cuesta.<\/p>\n<p>Técnicas:<\/p>\n<ul>\n<li><strong>Sándwich (panqueque):<\/strong> una mano arriba y otra abajo, aplaudiendo el disco. La más segura; la default.<\/li>\n<li><strong>Pinza (C):<\/strong> con una o dos manos al borde, para discos altos o bajos.<\/li>\n<li><strong>En carrera y en el aire:<\/strong> atacar el disco, no esperarlo.<\/li>\n<\/ul>"}, {"id": "cortes", "carpeta": "04-cortes", "num": "04", "nombre": "Cortes", "html": "<p>Moverse sin disco para quedar libre. Con 6 personas (3v3) cada uno corta muchísimo, así que es la habilidad que más se nota en el partido.<\/p>\n<p>Progresión:<\/p>\n<ol>\n<li>Corte en V (amagar en una dirección, frenar, salir en la otra).<\/li>\n<li>Timing: cortar cuando el lanzador está listo para lanzar (recién atrapó y pivoteó).<\/li>\n<li>Despejar: después de cortar y no recibir, salir del camino para el próximo.<\/li>\n<li>Corte profundo (ir largo cuando el defensor está pegado de frente).<\/li>\n<\/ol>"}, {"id": "defensa-individual", "carpeta": "05-defensa-individual", "num": "05", "nombre": "Defensa individual", "html": "<p>Dos trabajos: marcar al que tiene el disco (la marca) y seguir a un cortador.<\/p>\n<p>Progresión:<\/p>\n<ol>\n<li>Marca: distancia, cuenta (stall) en voz alta, forzar un lado.<\/li>\n<li>Marcar a un cortador: posición entre el cortador y el disco, mirar a los dos.<\/li>\n<li>Defensa del pase largo: no dejarse pasar por atrás.<\/li>\n<\/ol>\n<p>Reglas que se repasan acá: <span class=\"regla\">reglas/06-la-marca-y-la-cuenta.md<\/span> y <span class=\"regla\">reglas/09-faltas-y-contacto.md<\/span>.<\/p>"}, {"id": "ataque-en-equipo", "carpeta": "06-ataque-en-equipo", "num": "06", "nombre": "Ataque en equipo", "html": "<p>Con 6 personas el partido es 3v3 (o 4v4 si vienen 8). Las ideas son las mismas que en 7v7, con menos gente y más espacio: un lanzador, cortadores que se turnan, y el que no corta despeja.<\/p>\n<p>Progresión:<\/p>\n<ol>\n<li>Posesión sin zona de gol (mantener el disco, ver el espacio libre).<\/li>\n<li>Ataque 3v3: un corto y un largo, despejar después de cortar.<\/li>\n<li>Vertical stack (cuando haya 7 o más): fila en el medio y cortes hacia los costados.<\/li>\n<\/ol>"}, {"id": "defensa-en-equipo", "carpeta": "07-defensa-en-equipo", "num": "07", "nombre": "Defensa en equipo", "html": "<p>Defender juntos: todos fuerzan hacia el mismo lado, se habla, y el pull arranca cada punto.<\/p>\n<p>Reglas: <span class=\"regla\">reglas/04-el-pull.md<\/span>.<\/p>"}, {"id": "juegos-y-partidos", "carpeta": "08-juegos-y-partidos", "num": "08", "nombre": "Juegos y partidos", "html": "<p>Cada práctica termina con partido (pedido del equipo). Con 6 personas el formato base es 3v3; los juegos condicionados sirven para que el partido \"enseñe\" lo que se trabajó ese día.<\/p>"}, {"id": "reglas-y-espiritu", "carpeta": "09-reglas-y-espiritu", "num": "09", "nombre": "Reglas y espíritu", "html": "<p>Micro charlas de 5 minutos, durante la pausa de agua o antes del partido. Una por práctica, ligada a lo que se entrenó. Se apoyan en <span class=\"regla\">reglas/<\/span> (WFDF 2025-2028 en castellano) para no inventar nada.<\/p>\n<div class=\"tabla\"><table><tr><th>Charla<\/th><th>Cuándo<\/th><th>Base<\/th><\/tr><tr><td>Qué es el Spirit of the Game y cómo se autoarbitra<\/td><td>Semana 1<\/td><td><span class=\"regla\">reglas/01-espiritu-del-juego.md<\/span><\/td><\/tr><tr><td>Pivote y travel<\/td><td>Con <a class=\"ref\" href=\"#ej-pivote-con-marca\">Pivote contra la marca<\/a><\/td><td><span class=\"regla\">reglas/05-lanzador-pivote-y-travel.md<\/span><\/td><\/tr><tr><td>La marca y la cuenta (stall, disc space)<\/td><td>Con <a class=\"ref\" href=\"#ej-marca-y-forzar\">Marca y forzar<\/a><\/td><td><span class=\"regla\">reglas/06-la-marca-y-la-cuenta.md<\/span><\/td><\/tr><tr><td>Cuándo hay turnover y qué es un gol<\/td><td>Con el primer partido<\/td><td><span class=\"regla\">reglas/07-recepcion-posesion-y-turnovers.md<\/span>, <span class=\"regla\">reglas/08-el-gol.md<\/span><\/td><\/tr><tr><td>El pull y cómo arranca el punto<\/td><td>Con <a class=\"ref\" href=\"#ej-pull-y-bajar-juntos\">Pull y bajar juntos<\/a><\/td><td><span class=\"regla\">reglas/04-el-pull.md<\/span><\/td><\/tr><tr><td>Faltas, contacto y cómo se llama<\/td><td>Con <a class=\"ref\" href=\"#ej-atacar-el-disco\">Atacar el disco (con defensor de atrás)<\/a> o <a class=\"ref\" href=\"#ej-marcar-al-cortador\">Marcar al cortador<\/a><\/td><td><span class=\"regla\">reglas/09-faltas-y-contacto.md<\/span>, <span class=\"regla\">reglas/10-llamadas-check-y-continuacion.md<\/span><\/td><\/tr><tr><td>Mixto: cómo funciona la proporción<\/td><td>Cuando haya 7 o más<\/td><td><span class=\"regla\">reglas/02-cancha-equipos-y-mixto.md<\/span><\/td><\/tr><\/table><\/div>\n<p>Formato: Franco hace una pregunta (\"¿qué pasa si el disco toca la línea?\"), escucha dos respuestas, da la regla con el número y la prueban en el partido.<\/p>"}], "ejercicios": [{"id": "activacion-dinamica", "habilidad": "calentamiento", "nombre": "Activación dinámica", "nivel": "inicial", "jugadores": "cualquier cantidad", "discos": "0", "conos": "2", "duracion": "8-10 min", "intensidad": "baja a media", "fuente": "propia", "para_que": "subir la temperatura, movilizar cadera y tobillos y dejar el cuerpo listo para frenar y arrancar.", "html": "<h3>Armado<\/h3>\n<p>Dos conos a 20 m. Todos en línea en un cono; van con el ejercicio y vuelven trotando.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>Trote suave (2 idas y vueltas).<\/li>\n<li>Rodillas arriba y talones a la cola.<\/li>\n<li>Desplazamiento lateral (mirando a un lado a la ida, al otro a la vuelta).<\/li>\n<li>Paso cruzado (carioca).<\/li>\n<li>Estocada caminando con giro de tronco.<\/li>\n<li>Patada de frente (pierna estirada, mano contraria al pie).<\/li>\n<li>Abrir y cerrar cadera caminando.<\/li>\n<li>Dos progresiones: arrancan al 50 % y terminan al 80 %.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Apoyos cortos y activos, mirada al frente.<\/li>\n<li>En la estocada, la rodilla de adelante no pasa la punta del pie.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>Todos juntos. Lo conduce uno distinto cada semana (suma pertenencia).<\/p>\n<h3>Más fácil / más difícil<\/h3>\n<ul>\n<li>Más fácil: solo trote, laterales y progresiones.<\/li>\n<li>Más difícil: saltos cortos y aceleraciones de 5 m.<\/li>\n<\/ul>", "png": null, "mp4": null}, {"id": "frenar-y-cambiar", "habilidad": "calentamiento", "nombre": "Frenar y cambiar de dirección", "nivel": "inicial", "jugadores": "cualquier cantidad", "discos": "0", "conos": "3", "duracion": "5-8 min", "intensidad": "media", "fuente": "propia", "para_que": "aprender a frenar bajo (la base del corte en V) y cuidar las rodillas.", "html": "<h3>Armado<\/h3>\n<p>Tres conos en línea: salida, a 5 m y a 10 m.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>Corren 5 m, frenan en dos o tres pasos cortos bajando la cadera y vuelven trotando.<\/li>\n<li>Corren 10 m, plantan el pie de afuera y salen hacia atrás en diagonal (la V sin disco).<\/li>\n<li>A la voz de Franco: arrancan y, a la palmada, frenan y cambian hacia donde señala.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Bajar la cadera para frenar, peso adelante, rodilla alineada con el pie (que no se vaya hacia adentro).<\/li>\n<li>Pasos cortos antes del cambio de dirección.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>Dos filas de 3, salen de a dos (compiten sin decirlo).<\/p>\n<h3>Más fácil / más difícil<\/h3>\n<ul>\n<li>Más fácil: frenar solo en línea recta.<\/li>\n<li>Más difícil: un defensor copia el movimiento y el atacante intenta sacarle un paso.<\/li>\n<\/ul>", "png": null, "mp4": null}, {"id": "vuelta-a-la-calma", "habilidad": "calentamiento", "nombre": "Vuelta a la calma y ronda de spirit", "nivel": "inicial", "jugadores": "cualquier cantidad", "discos": "0", "conos": "0", "duracion": "5-10 min", "intensidad": "baja", "fuente": "propia", "para_que": "cerrar la práctica, estirar y armar grupo.", "html": "<h3>Cómo se hace<\/h3>\n<ol>\n<li>Ronda en círculo, estiramiento estático de 20-30 s: cuádriceps, isquios, gemelos, cadera, hombro del brazo de lanzar.<\/li>\n<li>Mientras estiran, cada uno dice una cosa que le salió bien y una que quiere mejorar.<\/li>\n<li>Franco cierra con el foco de la próxima práctica y recuerda horario (y que traigan a alguien).<\/li>\n<\/ol>\n<h3>Con 6 personas<\/h3>\n<p>Todos juntos. Es el momento para anotar en <code>Entrenamientos/feedback.md<\/code> qué funcionó.<\/p>", "png": null, "mp4": null}, {"id": "distancia-y-angulos", "habilidad": "lanzamientos", "nombre": "Distancia y ángulos (inside-out, outside-in, hammer)", "nivel": "intermedio", "jugadores": "pares (ideal 6)", "discos": "3-6", "conos": "0", "duracion": "10-15 min", "intensidad": "baja", "fuente": "propia", "para_que": "pasar de \"llega\" a \"llega donde quiero\". Recién cuando el pase plano a 10 m sale 8 de 10 veces.", "html": "<h3>Cómo se hace<\/h3>\n<ol>\n<li><strong>Distancia:<\/strong> parejas a 15 m, después 20 m. Se gana distancia con rotación (muñeca) y paso hacia adelante, no con fuerza de brazo.<\/li>\n<li><strong>Outside-in (OI):<\/strong> el disco sale inclinado con el borde de afuera hacia abajo y curva hacia el receptor. Sirve para rodear una marca.<\/li>\n<li><strong>Inside-out (IO):<\/strong> el borde de afuera hacia arriba; sale hacia adentro y se abre. Es el \"break\" clásico.<\/li>\n<li><strong>Hammer (solo si los anteriores salen):<\/strong> forehand por arriba de la cabeza, el disco viaja invertido. 10 intentos por persona, a 10 m.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Que el ángulo lo dé la muñeca al soltar, no el cuerpo torcido.<\/li>\n<li>En distancia: soltar a la altura del pecho, no hacia arriba.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>3 parejas, 4 minutos por tipo de pase. Franco elige uno solo por práctica si el grupo es nuevo.<\/p>", "png": null, "mp4": null}, {"id": "lanzar-al-espacio", "habilidad": "lanzamientos", "nombre": "Lanzar al espacio (pase adelantado)", "nivel": "inicial-intermedio", "jugadores": "4-8 (ideal 6)", "discos": "4-6", "conos": "2", "duracion": "10-15 min", "intensidad": "media", "fuente": "USA Ultimate Skills and Drills Manual (adaptado, \"drill de dos filas\")", "para_que": "dejar de tirarle al cuerpo de alguien que corre y poner el disco donde va a estar.", "html": "<h3>Armado<\/h3>\n<p>Dos conos a 12 m en diagonal. Fila de lanzadores (con todos los discos) en un cono, fila de corredores en el otro.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>El primer corredor sale en diagonal cruzando delante del lanzador.<\/li>\n<li>El lanzador suelta cuando el corredor está a mitad de camino y apunta 2-3 m por delante.<\/li>\n<li>El corredor atrapa en carrera, frena y lleva el disco a la fila de lanzadores. El lanzador va a la fila de corredores.<\/li>\n<li>5 minutos con backhand, 5 con forehand (el corredor sale hacia el otro lado).<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Lanzar antes, no cuando el corredor ya llegó.<\/li>\n<li>Disco a la altura del pecho y plano, que flote hacia el corredor.<\/li>\n<li>El corredor atrapa con dos manos sin frenar antes de tiempo.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>3 y 3. Con 6 discos no hay espera: sale uno cada 4-5 segundos.<\/p>\n<h3>Más fácil / más difícil<\/h3>\n<ul>\n<li>Más fácil: el corredor trota.<\/li>\n<li>Más difícil: agregar un defensor que sigue al corredor a un paso.<\/li>\n<\/ul>", "png": "media/02-lanzamientos/lanzar-al-espacio.png", "mp4": "media/02-lanzamientos/lanzar-al-espacio.mp4"}, {"id": "parejas-backhand-forehand", "habilidad": "lanzamientos", "nombre": "Parejas de backhand y forehand", "nivel": "inicial", "jugadores": "pares (ideal 6, 3 parejas)", "discos": "3 (uno por pareja)", "conos": "0", "duracion": "10-15 min", "intensidad": "baja", "fuente": "USA Ultimate Intro Skills & Drills Manual (adaptado)", "para_que": "repeticiones. Es el ejercicio que más rinde por minuto.", "html": "<h3>Armado<\/h3>\n<p>Parejas enfrentadas a 6-8 m, todas mirando en el mismo sentido (así nadie recibe un disco de costado).<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>3 min backhand y 3 min forehand a 6 m.<\/li>\n<li>Un paso atrás cada uno: 3 min backhand y 3 min forehand.<\/li>\n<li>Cierre: 10 pases seguidos sin que caiga, alternando lados. Si cae, vuelven a cero.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li><strong>Backhand:<\/strong> agarre firme (pulgar arriba, cuatro dedos abajo contra el borde), hombro apuntando al compañero, soltar con golpe de muñeca, disco plano.<\/li>\n<li><strong>Forehand:<\/strong> índice y medio contra el borde interno, pulgar arriba, codo cerca del cuerpo; la muñeca hace el trabajo (como tirar una piedra rasante al agua). Disco plano, sin inclinar hacia afuera.<\/li>\n<li>Siempre apuntar al pecho del compañero.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>3 parejas en fila. Franco recorre y corrige de a una pareja.<\/p>\n<h3>Más fácil / más difícil<\/h3>\n<ul>\n<li>Más fácil: 4 m y solo backhand.<\/li>\n<li>Más difícil: el receptor da un paso a un lado antes de cada pase y el lanzador tiene que ponerlo ahí.<\/li>\n<\/ul>", "png": "media/02-lanzamientos/parejas-backhand-forehand.png", "mp4": "media/02-lanzamientos/parejas-backhand-forehand.mp4"}, {"id": "pivote-con-marca", "habilidad": "lanzamientos", "nombre": "Pivote contra la marca", "nivel": "inicial", "jugadores": "tríos (ideal 6, 2 tríos)", "discos": "2", "conos": "0", "duracion": "10-15 min", "intensidad": "baja a media", "fuente": "USA Ultimate Skills and Drills Manual (adaptado)", "para_que": "lanzar con alguien enfrente. Usar el pie de apoyo, amagar y soltar por el lado abierto.", "html": "<h3>Armado<\/h3>\n<p>Tríos en línea: lanzador, marca (a un brazo de distancia) y receptor a 8 m.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>La marca cuenta en voz alta \"stall 1, stall 2...\" hasta 6 (después hasta 10) y tapa un lado.<\/li>\n<li>El lanzador amaga hacia el lado tapado y pivotea con un paso largo y bajo hacia el lado abierto para pasar.<\/li>\n<li>Cada 5 pases rotan: lanzador a marca, marca a receptor, receptor a lanzador.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>El pie de pivote no se levanta ni se arrastra (si se mueve, es travel: ver <span class=\"regla\">reglas/05-lanzador-pivote-y-travel.md<\/span>).<\/li>\n<li>Paso largo y bajo, rodilla flexionada, soltar lejos del cuerpo de la marca.<\/li>\n<li>La marca no toca, deja al menos un diámetro de disco y cuenta claro (<span class=\"regla\">reglas/06-la-marca-y-la-cuenta.md<\/span>).<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>Dos tríos en paralelo. En la primera ronda Franco hace de marca para mostrar.<\/p>\n<h3>Más fácil / más difícil<\/h3>\n<ul>\n<li>Más fácil: la marca solo cuenta, sin tapar.<\/li>\n<li>Más difícil: la marca tapa de verdad y el receptor se mueve un paso hacia el lado abierto.<\/li>\n<\/ul>", "png": "media/02-lanzamientos/pivote-con-marca.png", "mp4": "media/02-lanzamientos/pivote-con-marca.mp4"}, {"id": "atacar-el-disco", "habilidad": "recepcion", "nombre": "Atacar el disco (con defensor de atrás)", "nivel": "inicial-intermedio", "jugadores": "tríos (ideal 6)", "discos": "2-3", "conos": "2", "duracion": "10 min", "intensidad": "media-alta", "fuente": "propia", "para_que": "aprender a ir hacia el disco para que el defensor no llegue. Prepara para el partido.", "html": "<h3>Armado<\/h3>\n<p>Tríos: lanzador en un cono, receptor a 10 m y un defensor dos pasos detrás del receptor.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>El lanzador tira un pase flotado hacia el receptor.<\/li>\n<li>El receptor da dos pasos fuertes hacia el disco y atrapa en el punto más alto o más adelantado que puede.<\/li>\n<li>El defensor intenta tocar el disco desde atrás (sin contacto con el receptor).<\/li>\n<li>5 intentos y rotan los tres roles.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>El receptor no espera: ataca el disco y protege con el cuerpo.<\/li>\n<li>El defensor juega el disco, no el cuerpo. Si hay contacto, es falta (<span class=\"regla\">reglas/09-faltas-y-contacto.md<\/span>).<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>Dos tríos en paralelo.<\/p>\n<h3>Más fácil / más difícil<\/h3>\n<ul>\n<li>Más fácil: el defensor arranca a 4 pasos.<\/li>\n<li>Más difícil: pase alto y el receptor salta (atrapar en el aire).<\/li>\n<\/ul>", "png": "media/03-recepcion/atacar-el-disco.png", "mp4": "media/03-recepcion/atacar-el-disco.mp4"}, {"id": "sandwich-y-pinza", "habilidad": "recepcion", "nombre": "Sándwich y pinza", "nivel": "inicial", "jugadores": "pares (ideal 6)", "discos": "3", "conos": "0", "duracion": "5-10 min", "intensidad": "baja", "fuente": "USA Ultimate Intro Skills & Drills Manual (adaptado)", "para_que": "que la atrapada segura sea automática.", "html": "<h3>Cómo se hace<\/h3>\n<ol>\n<li>Parejas a 5 m. El lanzador tira a la altura del pecho: el receptor atrapa siempre en sándwich (mano de arriba y mano de abajo se cierran como un aplauso). 2 min.<\/li>\n<li>El lanzador varía: alto (sobre la cabeza) y bajo (rodillas). Esos se atrapan en pinza con dos manos (pulgares abajo en los altos, pulgares arriba en los bajos). 3 min.<\/li>\n<li>Juego: cada drop resta un punto, cada atrapada en sándwich suma. La pareja que llega a 15 primero gana.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Mirar el disco hasta que entra en las manos.<\/li>\n<li>Brazos adelante, ir hacia el disco, no esperarlo con el cuerpo.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>3 parejas, rotan de pareja a mitad del ejercicio.<\/p>", "png": null, "mp4": null}, {"id": "corte-en-v", "habilidad": "cortes", "nombre": "Corte en V", "nivel": "inicial", "jugadores": "3-8 (ideal 6)", "discos": "3-4", "conos": "2", "duracion": "10-15 min", "intensidad": "media-alta", "fuente": "USA Ultimate Skills and Drills Manual (adaptado)", "para_que": "el movimiento base para quedar libre: llevar al defensor hacia un lado y salir hacia el otro.", "html": "<h3>Armado<\/h3>\n<p>Un cono para el lanzador y otro a 16 m para la fila de cortadores. El lanzador tiene los discos.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>El primer cortador arranca hacia la zona profunda: 2 o 3 pasos fuertes (tiene que parecer de verdad).<\/li>\n<li>Frena en pasos cortos, planta el pie de afuera y vuelve en diagonal hacia el disco.<\/li>\n<li>El lanzador suelta cuando el cortador cambia de dirección, hacia el espacio.<\/li>\n<li>El cortador atrapa con dos manos, frena y pasa a ser lanzador; el lanzador va al final de la fila.<\/li>\n<li>Cada 5 minutos se cambia de lado (corte hacia el forehand y hacia el backhand).<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>El amague tiene que ser creíble: velocidad, no solo un pasito.<\/li>\n<li>Frenar bajo (ver <a class=\"ref\" href=\"#ej-frenar-y-cambiar\">Frenar y cambiar de dirección<\/a>).<\/li>\n<li>Volver al disco en diagonal, no en línea recta hacia el lanzador.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>1 lanzador + fila de 5. Sale un cortador cada 4-5 segundos; mucha intensidad, cortar en bloques de 5 minutos con pausa.<\/p>\n<h3>Más fácil / más difícil<\/h3>\n<ul>\n<li>Más fácil: sin amague, solo correr y atrapar adelantado.<\/li>\n<li>Más difícil: agregar un defensor (ver <a class=\"ref\" href=\"#ej-go-to\">Go-to (corte + pase de continuación)<\/a>).<\/li>\n<\/ul>", "png": "media/04-cortes/corte-en-v.png", "mp4": "media/04-cortes/corte-en-v.mp4"}, {"id": "corte-profundo", "habilidad": "cortes", "nombre": "Corte profundo", "nivel": "intermedio", "jugadores": "4-8 (ideal 6)", "discos": "4-6", "conos": "2", "duracion": "10-15 min", "intensidad": "alta", "fuente": "propia", "para_que": "castigar al defensor que marca de frente y pegado. Un pase largo vale puntos.", "html": "<h3>Armado<\/h3>\n<p>Lanzador en un cono; fila de cortadores a 12 m; la zona profunda llega hasta 35-40 m.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>El cortador amaga corto (2 pasos hacia el lanzador) y sale hacia atrás en diagonal, hacia el lado del pase.<\/li>\n<li>El lanzador espera a que el cortador esté de espaldas y corriendo, y tira un backhand largo que caiga delante de él.<\/li>\n<li>El cortador atrapa y vuelve trotando por afuera.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Correr mirando el disco por encima del hombro, sin frenar.<\/li>\n<li>El lanzador apunta al espacio, no al cortador. Mejor largo que corto.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>1 lanzador (rota cada 5 pases) + 5 cortadores. Es muy exigente: bloques de 4 minutos con pausa.<\/p>\n<h3>Más fácil / más difícil<\/h3>\n<ul>\n<li>Más fácil: 20 m.<\/li>\n<li>Más difícil: defensor detrás, compitiendo por el disco.<\/li>\n<\/ul>", "png": null, "mp4": null}, {"id": "go-to", "habilidad": "cortes", "nombre": "Go-to (corte + pase de continuación)", "nivel": "inicial-intermedio", "jugadores": "5-8 (ideal 6)", "discos": "4-6", "conos": "3", "duracion": "15 min", "intensidad": "alta", "fuente": "USA Ultimate Skills and Drills Manual (adaptado)", "para_que": "encadenar corte, atrapada, pivote y pase al siguiente que corta. Es la base del flujo de ataque.", "html": "<h3>Armado<\/h3>\n<p>Tres conos en triángulo: lanzador abajo a la izquierda, fila de cortadores arriba (a 15 m), y un cono de llegada a la derecha a media altura.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>El cortador 1 hace un corte en V y recibe del lanzador a media cancha (pase de \"salida\").<\/li>\n<li>Apenas atrapa, pivotea hacia arriba.<\/li>\n<li>El cortador 2 sale de la fila con un corte profundo o en V y recibe el pase de continuación de 1.<\/li>\n<li>Todos avanzan un lugar: el lanzador va a la fila, 1 pasa a ser lanzador, 2 trae el disco.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Cortar en el momento justo: el 2 arranca cuando el 1 está atrapando, no antes ni después.<\/li>\n<li>Pivotear rápido hacia adelante después de atrapar (mirar el campo).<\/li>\n<li>Pases adelantados al espacio.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>1 lanzador + 5 en fila. Cambiar de lado cada 5 minutos.<\/p>\n<h3>Más fácil / más difícil<\/h3>\n<ul>\n<li>Más fácil: sin el segundo pase.<\/li>\n<li>Más difícil: un defensor sobre el cortador 1 (marcaje real).<\/li>\n<\/ul>", "png": "media/04-cortes/go-to.png", "mp4": "media/04-cortes/go-to.mp4"}, {"id": "marca-y-forzar", "habilidad": "defensa-individual", "nombre": "Marca y forzar", "nivel": "inicial", "jugadores": "tríos (ideal 6)", "discos": "2", "conos": "2", "duracion": "10 min", "intensidad": "media", "fuente": "USA Ultimate Skills and Drills Manual (adaptado)", "para_que": "que la marca sirva: tapar un lado para que el lanzador solo pueda pasar por el otro, donde espera el resto de la defensa.", "html": "<h3>Armado<\/h3>\n<p>Tríos. Lanzador con disco, marca enfrente, y dos conos a 10 m: uno a la izquierda y uno a la derecha del lanzador. Un receptor se para en el cono que elija.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>Franco dice \"forzamos forehand\" (o backhand). La marca se para corrida hacia el lado tapado, a un brazo de distancia, rodillas flexionadas y brazos abiertos.<\/li>\n<li>La marca cuenta en voz alta hasta 10 (\"stall uno... stall diez\").<\/li>\n<li>El lanzador intenta pasar al cono del lado tapado. Si la marca toca el disco o el lanzador tiene que tirar por el lado forzado, punto para la defensa.<\/li>\n<li>5 intentos y rotan.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Pies que se mueven con el pivote (pasitos laterales cortos), no los brazos solos.<\/li>\n<li>Nunca saltar a los amagues: se queda en su lugar y reacciona.<\/li>\n<li>Contar claro, a ritmo de segundos. Si llega a 10 antes del pase, es turnover (stall out).<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>Dos tríos. Cambiar el lado forzado a mitad del ejercicio.<\/p>", "png": "media/05-defensa-individual/marca-y-forzar.png", "mp4": "media/05-defensa-individual/marca-y-forzar.mp4"}, {"id": "marcar-al-cortador", "habilidad": "defensa-individual", "nombre": "Marcar al cortador", "nivel": "inicial-intermedio", "jugadores": "4-8 (ideal 6)", "discos": "3", "conos": "2", "duracion": "10-15 min", "intensidad": "alta", "fuente": "propia", "para_que": "seguir a un cortador sin perderlo y sin dejarle el pase fácil.", "html": "<h3>Armado<\/h3>\n<p>Como <a class=\"ref\" href=\"#ej-corte-en-v\">Corte en V<\/a>, pero cada cortador sale con un defensor.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>El defensor se para entre el cortador y el disco, un paso corrido hacia el lado más peligroso (el profundo, al principio).<\/li>\n<li>El cortador hace su corte en V; el defensor lo sigue mirando al cortador y de reojo al disco.<\/li>\n<li>Si el defensor toca el disco o el pase no sale en 5 segundos, gana la defensa.<\/li>\n<li>Ataque pasa a defensa, defensa a la fila.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Posición: ver al disco y al cortador sin girar la cabeza del todo (cuerpo de costado).<\/li>\n<li>No dejarse pasar por atrás: es mejor ceder el pase corto que el largo.<\/li>\n<li>Sin contacto. Si hay choque, se llama y se repite (<span class=\"regla\">reglas/09-faltas-y-contacto.md<\/span>).<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>1 lanzador, 1 marca opcional, y parejas de cortador y defensor. Rotan todos los roles.<\/p>", "png": null, "mp4": null}, {"id": "ataque-3v3-corto-largo", "habilidad": "ataque-en-equipo", "nombre": "Ataque 3v3, uno corto y uno largo", "nivel": "inicial-intermedio", "jugadores": "6", "discos": "2", "conos": "4", "duracion": "15-20 min", "intensidad": "alta", "fuente": "propia", "para_que": "la estructura simple que van a usar en el partido. Con 3 por equipo no hace falta más.", "html": "<h3>Armado<\/h3>\n<p>Cancha de partido 3v3 (zona de juego de 25 m y zonas de gol de 5 m marcadas con los 4 conos). El ataque arranca con el disco en la línea de gol propia.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>Posiciones de arranque: lanzador con disco, un cortador a 10 m adelante (el corto) y otro a 20 m (el largo), los dos en el centro.<\/li>\n<li>El largo amaga y corta hacia un costado; si no recibe, sigue de largo y despeja hacia el otro costado.<\/li>\n<li>El corto corta en V hacia el disco por el lado contrario. Uno de los dos tiene que quedar libre.<\/li>\n<li>Después de cada pase, el que tiraba sigue jugando: se ofrece como opción de atrás (para volver el disco) y luego corta.<\/li>\n<li>Primero sin defensa (caminando), después con defensa al 50 %, después de verdad.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Nunca los dos cortadores hacia el mismo lado.<\/li>\n<li>Si cortaste y no te la dieron, salí del espacio (despejar): esa zona es para el próximo.<\/li>\n<li>El lanzador tiene que ver primero el largo, después el corto.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>3 ataque, 3 defensa. Cada punto (o cada turnover) cambian roles.<\/p>", "png": "media/06-ataque-en-equipo/ataque-3v3-corto-largo.png", "mp4": "media/06-ataque-en-equipo/ataque-3v3-corto-largo.mp4"}, {"id": "posesion-cuadrado", "habilidad": "ataque-en-equipo", "nombre": "Posesión en el cuadrado", "nivel": "inicial", "jugadores": "6 (3v3) o 4 (2v2)", "discos": "1", "conos": "4", "duracion": "10-15 min", "intensidad": "alta", "fuente": "propia", "para_que": "pasar del ejercicio al juego. Moverse para ofrecer un pase, pivotear, ver al compañero libre. Sin zona de gol, así nadie piensa en tirar largo.", "html": "<h3>Armado<\/h3>\n<p>Cuadrado de 15 x 15 m con los 4 conos. Equipos por ropa (clara y oscura).<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>3v3 adentro del cuadrado. Reglas de ultimate: no se corre con el disco, cuenta hasta 10 (al principio hasta 8), si cae o sale es turnover.<\/li>\n<li>10 pases seguidos = 1 punto. Después de un punto, el disco pasa al otro equipo.<\/li>\n<li>Bloques de 3 minutos y descanso de 1.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Los dos sin disco se separan y se ofrecen en distintas direcciones (uno cerca, uno lejos).<\/li>\n<li>Moverse cuando el lanzador puede tirar, no quedarse parado esperando.<\/li>\n<li>La marca cuenta en voz alta siempre.<\/li>\n<\/ul>\n<h3>Más fácil / más difícil<\/h3>\n<ul>\n<li>Más fácil: cuadrado de 20 x 20 o 5 pases = punto.<\/li>\n<li>Más difícil: cuadrado de 12 x 12, cuenta hasta 6.<\/li>\n<\/ul>", "png": null, "mp4": null}, {"id": "vertical-stack", "habilidad": "ataque-en-equipo", "nombre": "Vertical stack (para 7 o más)", "nivel": "intermedio", "jugadores": "7-14", "discos": "2", "conos": "4", "duracion": "20 min", "intensidad": "alta", "fuente": "USA Ultimate Skills and Drills Manual (adaptado)", "para_que": "la formación de ataque más común en 7v7. Se usa recién cuando haya 7 o más en la práctica; con 6 se juega `ataque-3v3-corto-largo.md`.", "html": "<h3>Armado<\/h3>\n<p>Cancha completa o media cancha. Lanzador con disco y el resto en fila vertical en el centro, a 10 m del lanzador, separados 3 m entre sí.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li>El primero o el último de la fila corta hacia el costado abierto (el lado forzado por la defensa).<\/li>\n<li>El que no recibe vuelve a la fila por el costado, sin cruzarse con el siguiente corte.<\/li>\n<li>Corto desde adelante de la fila, largo desde atrás.<\/li>\n<li>Primero sin defensa, después con defensa.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>La fila deja libres los dos costados: es el espacio de los cortes.<\/li>\n<li>Un corte por vez; el siguiente sale cuando el anterior despeja.<\/li>\n<\/ul>", "png": null, "mp4": null}, {"id": "forzar-en-equipo", "habilidad": "defensa-en-equipo", "nombre": "Forzar en equipo", "nivel": "inicial-intermedio", "jugadores": "6", "discos": "1", "conos": "4", "duracion": "15 min", "intensidad": "alta", "fuente": "propia", "para_que": "que la marca y los que defienden cortadores trabajen juntos: la marca tapa un lado y los demás se corren hacia el lado abierto.", "html": "<h3>Cómo se hace<\/h3>\n<ol>\n<li>3v3 en cancha de partido. Antes de cada punto la defensa elige el lado (\"forehand\" o \"backhand\").<\/li>\n<li>La marca tapa ese lado. Los otros dos defensores se paran corridos hacia el lado abierto de su cortador.<\/li>\n<li>Punto para la defensa si el ataque completa un pase por el lado tapado (la marca falló) o si hay turnover.<\/li>\n<li>Pausas cortas de Franco para corregir posiciones (\"congelados\").<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Todos hablan el mismo idioma: \"¡forehand!\" en voz alta antes del pull.<\/li>\n<li>Los defensores de cortadores ceden el pase hacia el lado tapado (difícil para el lanzador) y cierran el abierto.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>3v3, cambian roles cada punto.<\/p>", "png": null, "mp4": null}, {"id": "pull-y-bajar-juntos", "habilidad": "defensa-en-equipo", "nombre": "Pull y bajar juntos", "nivel": "inicial", "jugadores": "6", "discos": "6-12", "conos": "4", "duracion": "10-15 min", "intensidad": "media", "fuente": "propia", "para_que": "cómo arranca cada punto. Tirar el pull, que la defensa baje en línea y cada uno tome a su jugador.", "html": "<h3>Armado<\/h3>\n<p>Cancha de 3v3. Defensa en su línea de gol, ataque en la línea de gol de enfrente.<\/p>\n<h3>Cómo se hace<\/h3>\n<ol>\n<li><strong>Técnica del pull (5 min):<\/strong> todos tiran 2 pulls cada uno con backhand, buscando altura y que caiga adentro de la cancha. Con 12 discos se tiran todos y después se juntan.<\/li>\n<li><strong>Bajar juntos:<\/strong> el que tira el pull levanta la mano; la defensa sale cuando el disco sale (no antes), corriendo en línea.<\/li>\n<li>Cada defensor dice en voz alta a quién toma (\"tengo a la de verde\").<\/li>\n<li>El que tiró el pull baja último y hace la marca.<\/li>\n<li>El ataque juega el punto completo.<\/li>\n<\/ol>\n<h3>Qué corregir<\/h3>\n<ul>\n<li>Pull: altura y que no salga de la cancha. Mejor corto y adentro que largo y afuera.<\/li>\n<li>Nadie sale antes de que el disco suelte (offside del pull).<\/li>\n<li>Hablar: nombre o color del rival.<\/li>\n<\/ul>\n<h3>Con 6 personas<\/h3>\n<p>3 y 3. Alternan quién pulla.<\/p>", "png": "media/07-defensa-en-equipo/pull-y-bajar-juntos.png", "mp4": "media/07-defensa-en-equipo/pull-y-bajar-juntos.mp4"}, {"id": "juegos-condicionados", "habilidad": "juegos-y-partidos", "nombre": "Juegos condicionados", "nivel": "inicial-intermedio", "jugadores": "4-10", "discos": "1", "conos": "4", "duracion": "10-20 min (primer partido del día)", "intensidad": "alta", "fuente": "Enseñanza por comprensión (ver fuentes.md)", "para_que": "", "html": "<p>Una regla extra en el primer partido del día para que el juego empuje el foco que se trabajó. El segundo partido es libre.<\/p>\n<div class=\"tabla\"><table><tr><th>Foco del día<\/th><th>Regla extra<\/th><\/tr><tr><td>Backhand / forehand<\/td><td>Solo vale el gol si el último pase fue con el lanzamiento del día<\/td><\/tr><tr><td>Pivote<\/td><td>La cuenta llega solo hasta 6: hay que pivotear rápido<\/td><\/tr><tr><td>Recepción<\/td><td>Drop propio = el otro equipo suma un punto<\/td><\/tr><tr><td>Corte en V<\/td><td>Prohibido el pase de más de 15 m: todos los cortes tienen que volver al disco<\/td><\/tr><tr><td>Despejar<\/td><td>Si dos atacantes quedan a menos de 3 m, turnover<\/td><\/tr><tr><td>Corte profundo<\/td><td>Gol desde fuera de la zona de un pase largo vale 2<\/td><\/tr><tr><td>Marca<\/td><td>La marca cuenta hasta 8 y el lado forzado es obligatorio (forehand)<\/td><\/tr><tr><td>Defensa<\/td><td>Turnover provocado por la defensa vale 1 punto extra<\/td><\/tr><tr><td>Pull<\/td><td>Cada punto arranca con pull; si cae afuera, el ataque arranca en el medio<\/td><\/tr><tr><td>Spirit<\/td><td>Cada llamada se explica con el número de regla (<span class=\"regla\">reglas/<\/span>)<\/td><\/tr><tr><td>Todos tocan<\/td><td>El gol vale si los 3 atacantes tocaron el disco en esa posesión<\/td><\/tr><\/table><\/div>", "png": null, "mp4": null}, {"id": "juegos-reducidos", "habilidad": "juegos-y-partidos", "nombre": "Juegos reducidos (si son 4 o 5)", "nivel": "inicial", "jugadores": "4-5", "discos": "1", "conos": "4", "duracion": "20-30 min", "intensidad": "alta", "fuente": "propia", "para_que": "cuando vienen pocos, igual hay partido.", "html": "<ul>\n<li><strong>2v2 en cancha chica:<\/strong> 15 x 25 m con zonas de 4 m. Cuenta hasta 8. Muy intenso: partidos a 3 puntos y rotan parejas.<\/li>\n<li><strong>2v2 + comodín (5 personas):<\/strong> el comodín juega siempre con el que ataca. Rota cada punto.<\/li>\n<li><strong>Posesión 3v2 (5 personas):<\/strong> el cuadrado de 15 m de <a class=\"ref\" href=\"#ej-posesion-cuadrado\">Posesión en el cuadrado<\/a>; si la defensa toca el disco, el que perdió pasa a defender.<\/li>\n<li><strong>Juego de la lata (4 personas):<\/strong> dos contra dos, cada pareja defiende un cono; gol si el disco pega en el cono rival después de al menos 3 pases.<\/li>\n<\/ul>", "png": null, "mp4": null}, {"id": "partido-3v3", "habilidad": "juegos-y-partidos", "nombre": "Partido 3v3", "nivel": "inicial", "jugadores": "6 (4v4 si son 8)", "discos": "1 (+1 de repuesto)", "conos": "4", "duracion": "30-45 min", "intensidad": "alta", "fuente": "propia", "para_que": "jugar. Es lo que engancha a la gente y donde se ve qué aprendieron.", "html": "<h3>Armado<\/h3>\n<ul>\n<li>Cancha de 20 m de ancho x 35 m de largo: zona de juego de 25 m y dos zonas de gol de 5 m. Los 4 conos marcan las dos líneas de gol (uno en cada punta). Si son 8, 25 x 45.<\/li>\n<li>Equipos por ropa: claras contra oscuras. Mezclar nivel y género en cada equipo (si hay una sola mujer, rotarla de equipo cada 2 puntos).<\/li>\n<\/ul>\n<h3>Reglas<\/h3>\n<ul>\n<li>Ultimate normal (<span class=\"regla\">reglas/<\/span>): sin correr con el disco, cuenta hasta 10, turnover si cae o sale, gol al atrapar dentro de la zona.<\/li>\n<li>Pull después de cada gol (el que hizo el gol defiende).<\/li>\n<li>Autoarbitraje: el que ve la falta la llama, se habla, y si no hay acuerdo el disco vuelve al último lanzador.<\/li>\n<li>A 5 o 7 puntos, o 15 minutos por partido. Entre partidos 2 minutos de agua y se rearman equipos.<\/li>\n<\/ul>\n<h3>Para que no se corte el ritmo<\/h3>\n<ul>\n<li>Si un punto dura más de 4 minutos, el próximo pase completado a la zona vale doble.<\/li>\n<li>Ronda de spirit al final: cada equipo dice una cosa buena del otro.<\/li>\n<\/ul>\n<h3>Qué mira Franco<\/h3>\n<ul>\n<li>Una sola cosa por partido, ligada al foco del día (ej.: \"hoy miro que despejen después de cortar\"). La dice antes de empezar y la comenta en el cierre.<\/li>\n<\/ul>", "png": null, "mp4": null}], "semanas": [{"id": "2026-11-13", "titulo": "Semana 1: backhand, pivote y atrapar", "html": "<p><strong>Viernes 13/11, 17 hs y sábado 14/11, 16 hs<\/stron   app.innerHTML = `
    <div class="cabeza"><span class="eyebrow">Plan de viernes y sábado</span><h1>${esc(s.titulo)}</h1></div>
    ${D.semanas.length > 1 ? `<div class="sel-semana"><label for="semana-sel">Otra semana</label><select id="semana-sel">${D.semanas.map(x => `<option value="${x.id}" ${x.id === s.id ? "selected" : ""}>${esc(x.id)}: ${esc(x.titulo)}</option>`).join("")}</select></div>` : ""}
    <section class="prosa prosa-ancha">${s.html}</section>`;
  const sel = app.querySelector("#semana-sel");
  if (sel) sel.onchange = () => vistaSemana(sel.value);
}

function vistaTexto(v, eyebrow, titulo, html) {
  marcarNav(v);
  app.innerHTML = `<div class="cabeza"><span class="eyebrow">${eyebrow}</span><h1>${titulo}</h1></div><section class="prosa prosa-ancha">${html}</section>`;
}

function ruta() {
  const h = location.hash.slice(1);
  if (h.startsWith("ej-")) return vistaEjercicio(h.slice(3));
  if (h.startsWith("hab-")) return vistaHabilidades(h.slice(4));
  if (h === "habilidades") return vistaHabilidades();
  if (h === "programa") return vistaTexto("programa", "Ciclo de 8 semanas", "Programa", D.programa);
  if (h === "equipo") return vistaTexto("equipo", "Gente, material y cancha", "Equipo", D.equipo);
  return vistaSemana();
}
addEventListener("hashchange", ruta);
ruta();
</script>
